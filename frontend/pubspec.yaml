name: fire_gaurd
description: "FireGuard — Real-time fire and smoke detection mobile app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # UI / layout
  flutter_screenutil: ^5.9.3

  # Routing
  go_router: ^17.2.1

  # State management
  provider: ^6.1.5+1

  # Networking
  dio: ^5.7.0

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # Firebase — push notifications
  firebase_core: ^3.13.1
  firebase_messaging: ^15.2.5

  # Local notification display
  flutter_local_notifications: ^18.0.1

  # Alarm sound
  audioplayers: ^6.4.0

  # Vibration
  vibration: ^3.1.0

  # Date formatting
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    # Place your alarm sound file here: assets/sounds/alarm.mp3
    # Any royalty-free siren MP3 works. Rename it to alarm.mp3.
    - assets/sounds/