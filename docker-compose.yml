version: "3.10"

services:
  ai_service:
    build:
      context: ./ai_service
    restart: always
    ports:
      - "8001:8001"
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      AI_SERVICE_URL: http://ai_service:8001
    volumes:
      - ./backend:/app
    depends_on:
      ai_service:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/')\""]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app_network:
    driver: bridge
